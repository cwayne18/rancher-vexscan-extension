# End-user (Rancher Prime) roles, distinct from the vexscan-scanner
# ServiceAccount's own ClusterRole/Role in charts/vexscan-scanner/templates/.
#
# IMPORTANT: apply this to Rancher's own management cluster (where Rancher
# Manager itself runs - usually called "local"), NOT to the downstream RKE2
# cluster vexscan-scanner is installed on. RoleTemplate is Rancher's
# management-plane RBAC CRD (management.cattle.io/v3); that API group only
# exists on the cluster running Rancher Manager, never on a downstream
# cluster, Rancher-managed or not. Applying it anywhere else fails with
# "no matches for kind RoleTemplate" (confirmed: this used to live in
# charts/vexscan-scanner/templates/ and broke every real downstream install
# that way - moved here for that reason).
#
#   kubectl --context <rancher-server-context> apply -f rancher/roletemplates.yaml
#
# Once applied, a cluster-owner on any Rancher-managed downstream cluster can
# assign these from that cluster's Users & Permissions screen - a RoleTemplate
# only needs to exist once on the Rancher server to be assignable everywhere.
#
# A `context: "cluster"` RoleTemplate compiles into a ClusterRole +
# ClusterRoleBinding on the downstream cluster once assigned, so (same as
# Rancher's own default roles) any rule here - including ones on namespaced
# resources like ConfigMaps/Jobs - grants cluster-wide access to that
# resource kind, not just within cattle-vexscan-system. There's no narrower
# "this one namespace" tier available at the RoleTemplate level; an admin
# wanting tighter isolation needs to put cattle-vexscan-system in its own
# Rancher Project and use a `context: "project"` RoleTemplate instead. Not
# yet validated against a live Rancher Prime cluster - see README
# "Validation status".
apiVersion: management.cattle.io/v3
kind: RoleTemplate
metadata:
  name: vexscan-view
displayName: "VEX Scan - View"
description: >-
  Read VexScanReport status (triage bucket/severity counts, phase) and the
  full gzipped vexscan JSON report ConfigMaps. No ability to trigger a scan.
context: "cluster"
rules:
  - apiGroups: ["vexscan.cattle.io"]
    resources: ["vexscanreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vexscan.cattle.io"]
    resources: ["vexscanreports/status"]
    verbs: ["get"]
  # Full per-image report.json.gz ConfigMaps, written only into
  # {{ .Values.namespace }} by the scanner's own Role (see role.yaml) -
  # see the caveat above re: this still being a cluster-wide grant.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: management.cattle.io/v3
kind: RoleTemplate
metadata:
  name: vexscan-operate
displayName: "VEX Scan - Operator"
description: >-
  Everything in "VEX Scan - View", plus permission to trigger an on-demand
  scan ("Scan Now" in the vexscan Overview page, which clones the
  vexscan-scanner CronJob's spec.jobTemplate into a new Job).
context: "cluster"
# Composes on top of vexscan-view instead of repeating its rules.
roleTemplateNames:
  - vexscan-view
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
