vexscan:
  nav:
    overview: Overview
  overview:
    title: VEX Scan
    subtitle: >-
      Deterministic CVE presence/reachability triage for the exact RKE2
      components running on this cluster.
    scanNow: Scan Now
    scanNowNoPermission: >-
      You need the "VEX Scan - Operator" role on this cluster to trigger a
      scan. Ask a cluster owner to grant it from Cluster > Users &
      Permissions.
    scanQueued: Scan queued - this can take a few minutes depending on image count.
    noReport: No scan report yet. Run a scan to populate this page.
    rke2Version: RKE2 version
    lastScan: Last scan
    bucketHeading: Triage verdict
    bucketSubtitle: >-
      What vexscan determined about each CVE match's actual relevance to
      this cluster, not just its severity.
    bucket:
      affected: Affected
      vexed: Already Vexed
      undetermined: Undetermined
      ruledOut: Ruled Out
    bucketNote:
      affected: present and loadable
      vexed: somebody has answered
      undetermined: needs a human
      ruledOut: not present or unreachable
    severityHeading: By severity
    severitySubtitle: Breakdown of the {affected} Affected findings above
    severity:
      critical: Critical
      high: High
      medium: Medium
      low: Low
      unknown: Unknown
    table:
      cve: CVE
      component: Component
      package: Package
      ecosystem: Ecosystem
      severity: Severity
      verdict: Verdict
      reason: Reason
