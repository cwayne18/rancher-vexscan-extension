apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vexscanreports.vexscan.cattle.io
spec:
  group: vexscan.cattle.io
  names:
    kind: VexScanReport
    plural: vexscanreports
    singular: vexscanreport
    shortNames:
      - vsr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: RKE2 Version
          type: string
          jsonPath: .spec.rke2Version
        - name: Critical
          type: integer
          jsonPath: .status.summary.critical
        - name: High
          type: integer
          jsonPath: .status.summary.high
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Exact kubelet-reported build, e.g. "v1.30.4+rke2r1", or
                # "unknown" on a non-RKE2 cluster. Purely informational label
                # on the report - the scan itself scans every Pod actually
                # running in the cluster (`kubectl get pods -A -o yaml` piped
                # into `vexscan --images-from -`), not just RKE2's own images,
                # so this field no longer scopes/filters what gets scanned.
                rke2Version:
                  type: string
                # Which node the version was read from, for troubleshooting
                # mixed-version upgrade rollouts.
                sourceNode:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Scanning, Ready, Failed]
                lastScanTime:
                  type: string
                  format: date-time
                # Full `vexscan --format json` output is NOT stored here -
                # only summary counts, to stay well under etcd's per-object
                # size limit on clusters with hundreds of images. The full
                # report lives in the ConfigMap named in
                # componentResults[].reportConfigMapRef.
                summary:
                  type: object
                  properties:
                    # Counts by vexscan --severity.
                    critical: { type: integer }
                    high: { type: integer }
                    medium: { type: integer }
                    low: { type: integer }
                    unknown: { type: integer }
                    # Counts by vexscan's own finding bucket (see
                    # contrib/vexscan-dashboard.py bucket_of() in the vexscan
                    # repo): affected, vexed (exculpatory VEX statement
                    # applies), undetermined, ruledOut (not present/reachable).
                    affected: { type: integer }
                    vexed: { type: integer }
                    undetermined: { type: integer }
                    ruledOut: { type: integer }
                componentResults:
                  type: array
                  items:
                    type: object
                    properties:
                      component:
                        type: string
                      image:
                        type: string
                      findings:
                        type: integer
                      # Same bucket_of() rules as status.summary above,
                      # computed per-component instead of cluster-wide.
                      affected: { type: integer }
                      vexed: { type: integer }
                      undetermined: { type: integer }
                      ruledOut: { type: integer }
                      reportConfigMapRef:
                        type: string
                message:
                  type: string
                # Rolling trend of past scans' summary counts, oldest first,
                # capped at a fixed length by the scanner itself (not the
                # apiserver) - so this stays small and bounded without
                # needing a separate CR-per-scan + retention job. Counts
                # only, no findings/evidence, so size stays trivial however
                # large a single scan's raw report is.
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      time: { type: string, format: date-time }
                      rke2Version: { type: string }
                      critical: { type: integer }
                      high: { type: integer }
                      medium: { type: integer }
                      low: { type: integer }
                      unknown: { type: integer }
                      affected: { type: integer }
                      vexed: { type: integer }
                      undetermined: { type: integer }
                      ruledOut: { type: integer }
