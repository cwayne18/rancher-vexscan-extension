apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vexscan-scanner
  namespace: {{ .Values.namespace }}
rules:
  # Write the ConfigMap holding the full `vexscan --format json` output,
  # referenced from status.componentResults[].reportConfigMapRef. Scoped to
  # this chart's own namespace only.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vexscan-scanner
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vexscan-scanner
subjects:
  - kind: ServiceAccount
    name: vexscan-scanner
    namespace: {{ .Values.namespace }}
