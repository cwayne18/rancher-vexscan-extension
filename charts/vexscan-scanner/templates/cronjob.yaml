apiVersion: batch/v1
kind: CronJob
metadata:
  # Name/namespace are hardcoded in pkg/vexscan/pages/overview.vue (CRONJOB_NAME
  # / NAMESPACE constants) - keep these two in sync if either changes.
  name: vexscan-scanner
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: vexscan-scanner
        spec:
          serviceAccountName: vexscan-scanner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # Explicit numeric UID so this doesn't depend on the image's USER
            # directive resolving to a numeric ID (confirmed live: a named
            # non-root user alone makes kubelet refuse to start the pod with
            # "image has non-numeric user, cannot verify user is non-root").
            # Must match the UID scanner/Dockerfile's USER actually runs as.
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: REPORT_NAME
                  value: {{ .Values.reportName | quote }}
                - name: REPORT_NAMESPACE
                  value: {{ .Values.namespace | quote }}
                - name: RKE2_IMAGE_PREFIX
                  value: {{ .Values.rke2ImagePrefix | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
